[package]
name = "gs308e"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Inspect and configure NETGEAR GS308Ev4 switches through their normal management interface"
readme = "README.md"
keywords = ["netgear", "gs308e", "switch", "cli", "vlan"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
ctrlc = { version = "3.5", features = ["termination"] }
shlex = "2"
httpdate = "1"
md5 = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "gzip", "form"] }
rpassword = "7"
scraper = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

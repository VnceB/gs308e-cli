name: Native release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_RUST_VERSION: '1.100.0'

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: rustup toolchain install "$RELEASE_RUST_VERSION" --profile minimal --target "$RELEASE_TARGET"
      - name: Verify release tag matches Cargo.toml version
        if: github.event_name == 'push'
        run: |
          version=$(cargo "+$RELEASE_RUST_VERSION" metadata --no-deps --format-version 1 \
            | python3 -c 'import json, sys; pkgs = [p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "gs308e"]; assert len(pkgs) == 1 and pkgs[0]; print(pkgs[0])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version v$version" >&2
            exit 1
          fi
      - name: Install OpenSSL development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - name: Build executable and archive
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          cargo "+$RELEASE_RUST_VERSION" build --release --locked --target "$RELEASE_TARGET"
          mkdir -p package
          cp "target/$RELEASE_TARGET/release/gs308e" LICENSE package/
          COPYFILE_DISABLE=1 tar -czf "gs308e-$RELEASE_TARGET.tar.gz" -C package gs308e LICENSE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gs308e-${{ matrix.target }}
          path: gs308e-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gs308e-*
          path: release
          merge-multiple: true
      - name: Generate checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && LC_ALL=C sha256sum gs308e-*.tar.gz > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" release/gs308e-*.tar.gz release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
